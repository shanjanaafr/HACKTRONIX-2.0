<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Ball Detection System{% endblock %}</title>

<!-- Bootstrap for grid/utilities, Bootstrap Icons for the sidebar -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<div class="app-shell">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="bi bi-cpu-fill"></i></div>
      <div class="brand-text">
        <span class="brand-title">BallVision</span>
        <span class="brand-sub">AI Detection Suite</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="{{ url_for('index') }}" class="nav-link {{ 'active' if request.path == '/' }}">
        <i class="bi bi-house-door-fill"></i><span>Home</span>
      </a>
      <a href="{{ url_for('detect_page') }}" class="nav-link {{ 'active' if request.path == '/detect' }}">
        <i class="bi bi-camera-video-fill"></i><span>Live Detection</span>
      </a>
      <a href="{{ url_for('history_page') }}" class="nav-link {{ 'active' if request.path == '/history' }}">
        <i class="bi bi-clock-history"></i><span>History</span>
      </a>
      <a href="{{ url_for('gallery_page') }}" class="nav-link {{ 'active' if request.path == '/gallery' }}">
        <i class="bi bi-images"></i><span>Gallery</span>
      </a>
      <a href="{{ url_for('analytics_page') }}" class="nav-link {{ 'active' if request.path == '/analytics' }}">
        <i class="bi bi-bar-chart-line-fill"></i><span>Analytics</span>
      </a>
      <a href="{{ url_for('settings_page') }}" class="nav-link {{ 'active' if request.path == '/settings' }}">
        <i class="bi bi-sliders"></i><span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="themeToggle" class="theme-toggle-btn">
        <i class="bi bi-moon-stars-fill"></i>
        <span>Toggle theme</span>
      </button>
    </div>
  </aside>

  <!-- ================= MOBILE TOPBAR ================= -->
  <header class="mobile-topbar d-flex d-lg-none align-items-center justify-content-between">
    <div class="brand-icon small"><i class="bi bi-cpu-fill"></i></div>
    <span class="brand-title">BallVision</span>
    <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
